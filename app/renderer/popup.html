<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  html, body { overflow: hidden; }
  body { display: flex; flex-direction: column; border: 1px solid #b2b6c0; height: 100vh; background: #fff; }
  .header {
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 8px;
    height: 26px; padding: 0 10px;
    background: #f4f4f6; color: #60646e; font-size: 12px;
    flex: none; user-select: none;
  }
  .header .right { margin-left: auto; color: #969aa2; font-size: 11px; }
  .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 10px;
    background: #fef3cd; color: #7a5b0a; border: 1px solid #f3dd8e;
  }
  .body { flex: 1; padding: 6px 14px 0; user-select: text; overflow: hidden; }
  .title {
    font-size: 15px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .info { color: #60646e; margin-top: 5px; }
  .note { color: #969aa2; font-size: 11px; margin-top: 4px; }
  .buttons { -webkit-app-region: no-drag; display: flex; gap: 5px; padding: 5px 8px 8px; flex: none; }
  .buttons button { flex: 1; padding: 6px 0; }
  .buttons .more { flex: 0 0 26px; padding: 7px 0; color: #60646e; }
  .menu {
    position: fixed; background: #fff; border: 1px solid #cbced5; border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; z-index: 10; min-width: 110px;
  }
  .menu div { padding: 7px 14px; cursor: pointer; }
  .menu div:hover { background: #f4f5f7; }

  /* ───────── 눈에 띄는 효과 ─────────
     알림이 떠도 못 보고 지나치면 이 앱은 아무것도 한 것이 없다. 그래서 기본으로 움직인다.
     전부 CSS 로만 한다 — OS 마다 다른 창 깜빡임 API 를 쓰면 어디선가 조용히 아무 일도
     일어나지 않고, 그 사실을 아무도 모른다.

     색 효과(flash·pulse·rainbow)는 **창 전체 배경**을 물들인다. 제목 줄만 깜빡이면
     넓은 본문은 흰 채로 남아 눈에 띄지 않는다(그렇게 신고가 들어왔다). 그래서 body 의
     배경을 애니메이트하고, 위에 얹힌 영역(.header/.body/.buttons)은 배경을 비워 그 색이
     그대로 비치게 한다. 글자는 어두운 색이라 밝은 배경(노랑·연파랑·연초록·분홍) 위에서
     읽힌다 — 배경만 바뀌고 글자색은 건드리지 않는다.

     **멈추지 않는다(infinite).** 이 앱의 약속은 "완료·취소를 누를 때까지 계속 알린다" 이다.
     효과가 먼저 멎으면 그 약속이 화면에서만 조용히 깨진다 — 팝업은 그대로 떠 있는데
     더 이상 눈에 띄지 않아, 사용자는 있는 줄도 모르고 지나친다.
     멈추는 방법은 하나뿐이고 그게 맞다: 확인·미루기·완료·취소를 누르는 것.
     그 순간 body[data-acted] 가 붙어 효과가 즉시 멎는다(아래) — 창이 닫히기까지의
     짧은 사이에도 계속 번쩍이면 눌렸는지 아닌지 알 수가 없다. */
  @keyframes td-flash {
    0%, 100% { background: #fff; }
    50%      { background: #ffd54a; }
  }
  @keyframes td-pulse {
    0%, 100% { background: #fff; }
    50%      { background: #bfe0ff; }
  }
  @keyframes td-rainbow {
    0%   { background: #ffd54a; }
    25%  { background: #b6f0a0; }
    50%  { background: #bfe0ff; }
    75%  { background: #ffc4ec; }
    100% { background: #ffd54a; }
  }
  @keyframes td-glow {
    0%, 100% { box-shadow: inset 0 0 0 2px rgba(232,80,60,.25); }
    50%      { box-shadow: inset 0 0 0 6px rgba(232,80,60,1); }
  }
  @keyframes td-shake {
    0%, 92%, 100% { transform: translateX(0); }
    93%, 97%      { transform: translateX(-3px); }
    95%, 99%      { transform: translateX(3px); }
  }

  /* 색이 창 전체를 채우려면 위에 얹힌 영역이 자기 배경으로 가리면 안 된다.
     제목 줄의 회색만 예외로 비운다(효과가 켜졌을 때만). */
  body[data-effect="flash"], body[data-effect="pulse"], body[data-effect="rainbow"] { animation-fill-mode: none; }
  body[data-effect="flash"]   .header,
  body[data-effect="pulse"]   .header,
  body[data-effect="rainbow"] .header { background: transparent; }

  /* 0.5초 주기 = 켜짐 0.25초 + 꺼짐 0.25초. 무한 반복 — 위 주석 참고. */
  body[data-effect="flash"]   { animation: td-flash 0.5s steps(1, end) infinite; }
  body[data-effect="pulse"]   { animation: td-pulse 0.5s steps(1, end) infinite; }
  body[data-effect="rainbow"] { animation: td-rainbow 2s linear infinite; }
  body[data-effect="glow"]    { animation: td-glow 0.5s ease-in-out infinite; }
  body[data-effect="shake"]   { animation: td-shake 2.2s ease-in-out infinite; }

  /* 사용자가 버튼을 눌렀다. 알림은 제 할 일을 다 했으므로 즉시 조용해진다.
     닫히는 순간까지 번쩍이면 "눌렸나?" 를 확인할 수 없고, 여러 모니터에 뜬 쌍둥이가
     차례로 닫힐 때 화면이 어지럽다. */
  body[data-acted] { animation: none !important; background: #fff !important; }
  body[data-acted] .header { background: #f4f4f6 !important; }

  /* OS 가 "움직임 줄이기" 를 켠 경우.
   *
   * 여기서 효과를 **통째로 끄면 안 된다.** 윈도우의 "애니메이션 표시" 는 기본으로 꺼져
   * 있는 환경이 흔하고(실제로 이 저장소의 스모크 환경이 그렇다), 그러면 알림이
   * 아무 표시 없이 조용히 떠서 놓치게 된다 — 이 효과를 넣은 이유가 바로 그것이었다.
   *
   * 그래서 줄이되 없애지 않는다. 규격이 줄이라는 것은 어지럼을 유발하는 **위치 이동**이고,
   * 그건 shake 뿐이다 — 그것만 정적 표시로 바꾼다. 빠른 점멸은 광과민에 위험하므로
   * 이 모드에서는 배경 효과의 주기를 늘린다(0.5초 → 1.4초).
   */
  @media (prefers-reduced-motion: reduce) {
    body[data-effect="shake"] { animation: none !important; box-shadow: inset 0 0 0 3px #e8503c; }
    /* 반복 횟수는 건드리지 않는다(계속 알려야 한다). 주기만 늘려 점멸을 느리게 한다. */
    body[data-effect="flash"] { animation-duration: 1.4s; }
    body[data-effect="pulse"] { animation-duration: 1.4s; }
    body[data-effect="rainbow"] { animation-duration: 4s; }
    body[data-effect="glow"]  { animation-duration: 1.4s; }
  }
</style>
</head>
<body>
  <div class="header">
    <span>≡ 할 일 알림</span>
    <span class="badge" id="preBadge" style="display:none"></span>
    <span class="right">드래그로 이동</span>
  </div>
  <div class="body">
    <div class="title" id="title"></div>
    <div class="info" id="info"></div>
    <div class="note" id="note"></div>
  </div>
  <div class="buttons">
    <button id="btnAck">확인</button>
    <button id="btnSnooze"></button>
    <button class="more" id="btnMore">▾</button>
    <button class="primary" id="btnDone">완료</button>
    <button class="danger-text" id="btnCancel">취소</button>
  </div>
  <div class="menu" id="menu"></div>

<script src="../shared/format.js"></script>
<script>
(() => {
  let data = null;

  const $ = id => document.getElementById(id);

  // 시각 표기는 shared/format.js 에서 나온다(설정을 팝업도 따른다).
  function fmtClock(d) {
    return TD_FORMAT.time(d, data || {});
  }

  function updateInfo() {
    if (!data) return;
    const due = new Date(data.dueIso);
    const now = new Date();
    const diffMin = Math.floor((now - due) / 60000);
    let rel;
    if (data.kind !== 'due') {
      const ahead = Math.max(0, Math.ceil((due - now) / 60000));
      rel = `${ahead}분 후 시작`;
    } else if (diffMin < 1 && diffMin > -1) rel = '지금';
    else if (diffMin < 0) rel = '곧';
    else if (diffMin < 60) rel = `${diffMin}분 지남`;
    else rel = `${Math.floor(diffMin / 60)}시간 ${diffMin % 60}분 지남`;

    $('info').textContent = data.kind === 'due'
      ? `${fmtClock(due)} 예정 · ${rel} · ${data.notifyCount}번째 알림`
      : `${fmtClock(due)} 예정 · ${rel}`;
  }

  function act(action, minutes) {
    if (!data) return;
    // 누른 즉시 효과를 멈춘다. 창이 닫히기까지의 짧은 사이에도 번쩍이면
    // 눌렸는지 아닌지 알 수가 없다(그리고 모니터마다 쌍둥이가 있어 더 어지럽다).
    document.body.dataset.acted = '1';
    window.api.invoke('popup-action', {
      popupKey: data.popupKey, masterId: data.masterId, key: data.key,
      kind: data.kind, action, minutes: minutes || 0, isPreview: data.isPreview,
    });
  }

  window.api.on('popup-init', d => {
    data = d;
    // 효과는 CSS 가 그린다 — 여기서는 어느 효과인지만 알려 준다.
    // 모르는 값이 오면 기본으로 떨어진다(설정 파일을 손으로 고친 경우).
    const EFFECTS = ['flash', 'pulse', 'glow', 'shake', 'rainbow', 'none'];
    document.body.dataset.effect = EFFECTS.indexOf(d.effect) >= 0 ? d.effect : 'flash';
    $('title').textContent = d.title;
    $('btnSnooze').textContent = `${d.defaultSnoozeMinutes}분 뒤`;
    if (d.kind !== 'due') {
      $('preBadge').style.display = '';
      $('preBadge').textContent = `${d.preMinutes}분 전 미리 알림`;
      $('note').textContent = d.isPreview ? '미리보기입니다' : '아직 시작 전입니다 — 정시에 다시 알립니다';
    } else {
      $('note').textContent = d.isPreview
        ? '미리보기입니다 — 아무 버튼이나 누르면 닫힙니다'
        : `완료·취소 전까지 ${d.renotifyMinutes}분마다 다시 알립니다`;
    }
    updateInfo();
  });

  setInterval(updateInfo, 30000);

  $('btnAck').onclick = () => act('ack');
  $('btnSnooze').onclick = () => act('snooze', data ? data.defaultSnoozeMinutes : 10);
  $('btnDone').onclick = () => act('done');
  $('btnCancel').onclick = () => act('cancel');

  // 미루기 메뉴는 registry.SNOOZE_PRESETS 에서 나온다.
  // 분 값을 창에 두 벌 적으면 등록표를 고쳐도 이 메뉴만 옛날 값으로 남는다.
  const menu = $('menu');
  for (const preset of window.api.registry.SNOOZE_PRESETS) {
    const item = document.createElement('div');
    item.textContent = preset.label;
    item.onclick = () => { menu.style.display = 'none'; act('snooze', preset.minutes); };
    menu.appendChild(item);
  }
  $('btnMore').onclick = (e) => {
    const r = e.target.getBoundingClientRect();
    menu.style.left = Math.max(4, r.left - 60) + 'px';
    menu.style.bottom = (window.innerHeight - r.top + 4) + 'px';
    menu.style.top = 'auto';
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  };
  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && e.target.id !== 'btnMore') menu.style.display = 'none';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') act('ack');
  });
})();
</script>
</body>
</html>
